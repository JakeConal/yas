{{- if .Values.productReindexJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: search-product-reindex
  labels:
    {{- include "search.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "search.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: product-reindex
    spec:
      serviceAccountName: search
      restartPolicy: Never
      containers:
        - name: reindex
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: yas-elasticsearch-credentials-secret
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yas-elasticsearch-credentials-secret
                  key: ELASTICSEARCH_PASSWORD
            - name: PRODUCT_URL
              value: http://product/product/storefront/products-es
            - name: PRODUCT_LIST_URL
              value: http://product/product/storefront/products?pageNo=0&pageSize=1000
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch-es-http.elasticsearch:9200
          command:
            - sh
            - -ec
            - |
              for i in $(seq 1 60); do
                if curl -fsS "$PRODUCT_LIST_URL" >/dev/null &&
                   curl -fsS -u "$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD" "$ELASTICSEARCH_URL" >/dev/null; then
                  break
                fi
                if [ "$i" = "60" ]; then
                  echo "Timed out waiting for product service and Elasticsearch"
                  exit 1
                fi
                sleep 5
              done

              curl -fsS -u "$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD" \
                -X DELETE "$ELASTICSEARCH_URL/product" >/dev/null || true

              curl -fsS -u "$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD" \
                -H "Content-Type: application/json" \
                -X PUT "$ELASTICSEARCH_URL/product" \
                --data '{
                  "settings": {
                    "number_of_replicas": 0,
                    "analysis": {
                      "filter": {
                        "autocomplete_filter": {
                          "type": "edge_ngram", "min_gram": 1, "max_gram": 50
                        }
                      },
                      "analyzer": {
                        "autocomplete_search": {
                          "type": "custom", "tokenizer": "standard", "filter": ["lowercase"]
                        },
                        "autocomplete_index": {
                          "type": "custom", "tokenizer": "standard",
                          "filter": ["lowercase", "autocomplete_filter"]
                        }
                      }
                    }
                  },
                  "mappings": {
                    "properties": {
                      "id": {"type": "long"},
                      "name": {
                        "type": "text", "analyzer": "autocomplete_index",
                        "search_analyzer": "autocomplete_search"
                      },
                      "slug": {"type": "keyword"},
                      "price": {"type": "double"},
                      "isPublished": {"type": "boolean"},
                      "isVisibleIndividually": {"type": "boolean"},
                      "isAllowedToOrder": {"type": "boolean"},
                      "isFeatured": {"type": "boolean"},
                      "thumbnailMediaId": {"type": "long"},
                      "brand": {"type": "text", "fielddata": true},
                      "categories": {"type": "keyword"},
                      "attributes": {"type": "keyword"},
                      "createdOn": {"type": "date"}
                    }
                  }
                }' >/dev/null

              indexed=0
              product_ids="$(curl -fsS "$PRODUCT_LIST_URL" \
                | sed 's/"id":/\n/g' \
                | sed -n 's/^\([0-9][0-9]*\).*/\1/p')"
              for id in $product_ids; do
                if body="$(curl -fsS "$PRODUCT_URL/$id" 2>/dev/null)"; then
                  echo "$body" | curl -fsS -u "$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD" \
                    -H "Content-Type: application/json" \
                    -X PUT "$ELASTICSEARCH_URL/product/_doc/$id" \
                    --data-binary @- >/dev/null
                  indexed=$((indexed + 1))
                fi
              done

              curl -fsS -u "$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD" \
                -X POST "$ELASTICSEARCH_URL/product/_refresh" >/dev/null
              echo "Indexed $indexed products into Elasticsearch"
{{- end }}
